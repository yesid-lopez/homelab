apiVersion: apps/v1
kind: Deployment
metadata:
  name: medidocs-api
  namespace: medidocs-api
  labels:
    app: medidocs-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medidocs-api
  template:
    metadata:
      labels:
        app: medidocs-api
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: api
          image: registry.yesidlopez.de/medidocs-api:v0.3.0 # {"$imagepolicy": "medidocs-api:medidocs-api"}
          ports:
            - containerPort: 8000
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: password}}
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: host}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: port}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: dbname}}
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)"
            - name: REDIS_URL
              value: "redis://medidocs-api-redis:6379/0"
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: OPENAI_API_KEY}}
            - name: OPENAI_MODEL
              value: "gpt-4o"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: THUMBNAIL_DIR
              value: "/app/thumbnails"
            - name: S3_ENDPOINT_URL
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: S3_PUBLIC_URL
              value: "https://media.luloai.com"
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: minio-credentials, key: rootUser}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-credentials, key: rootPassword}}
            - name: S3_BUCKET_NAME
              value: "medidocs-api"
            - name: ZILLIZ_URI
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: ZILLIZ_URI}}
            - name: ZILLIZ_TOKEN
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: ZILLIZ_TOKEN}}
            - name: ZILLIZ_COLLECTION_NAME
              value: "medical_documents"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: thumbnails
              mountPath: /app/thumbnails
          resources:
            requests: {memory: "256Mi", cpu: "250m"}
            limits: {memory: "1Gi", cpu: "1000m"}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 15
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 15
            periodSeconds: 30
      volumes:
        - name: uploads
          emptyDir: {}
        - name: thumbnails
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: medidocs-api-worker
  namespace: medidocs-api
  labels:
    app: medidocs-api-worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: medidocs-api-worker
  template:
    metadata:
      labels:
        app: medidocs-api-worker
    spec:
      imagePullSecrets:
        - name: registry-secret
      containers:
        - name: worker
          image: registry.yesidlopez.de/medidocs-api:v0.3.0 # {"$imagepolicy": "medidocs-api:medidocs-api"}
          command: ["uv", "run", "taskiq", "worker", "medical_docs.workers.document_processor:broker"]
          env:
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: user}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: password}}
            - name: PGHOST
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: host}}
            - name: PGPORT
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: port}}
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: medidocs-api-postgres-app, key: dbname}}
            - name: DATABASE_URL
              value: "postgresql+asyncpg://$(PGUSER):$(PGPASSWORD)@$(PGHOST):$(PGPORT)/$(PGDATABASE)"
            - name: REDIS_URL
              value: "redis://medidocs-api-redis:6379/0"
            - name: OPENAI_API_KEY
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: OPENAI_API_KEY}}
            - name: OPENAI_MODEL
              value: "gpt-4o"
            - name: UPLOAD_DIR
              value: "/app/uploads"
            - name: THUMBNAIL_DIR
              value: "/app/thumbnails"
            - name: S3_ENDPOINT_URL
              value: "http://minio.minio.svc.cluster.local:9000"
            - name: S3_PUBLIC_URL
              value: "https://media.luloai.com"
            - name: S3_ACCESS_KEY_ID
              valueFrom: {secretKeyRef: {name: minio-credentials, key: rootUser}}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-credentials, key: rootPassword}}
            - name: S3_BUCKET_NAME
              value: "medidocs-api"
            - name: ZILLIZ_URI
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: ZILLIZ_URI}}
            - name: ZILLIZ_TOKEN
              valueFrom: {secretKeyRef: {name: medidocs-api-secrets, key: ZILLIZ_TOKEN}}
            - name: ZILLIZ_COLLECTION_NAME
              value: "medical_documents"
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
            - name: thumbnails
              mountPath: /app/thumbnails
          resources:
            requests: {memory: "256Mi", cpu: "250m"}
            limits: {memory: "1Gi", cpu: "1000m"}
      volumes:
        - name: uploads
          emptyDir: {}
        - name: thumbnails
          emptyDir: {}
