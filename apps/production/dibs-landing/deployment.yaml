apiVersion: apps/v1
kind: Deployment
metadata:
  name: dibs-landing
  namespace: dibs
  labels:
    app: dibs-landing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dibs-landing
  template:
    metadata:
      labels:
        app: dibs-landing
    spec:
      imagePullSecrets:
        - name: registry-secret
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dibs-landing
          image: registry.yesidlopez.de/dibs-landing:v1.0.1 # {"$imagepolicy": "dibs:dibs-landing"}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "256Mi"
              cpu: "300m"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
