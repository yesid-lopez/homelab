apiVersion: v1
kind: ConfigMap
metadata:
  name: public-status-api-app
  namespace: public-status-api
data:
  app.py: |
    import calendar
    import json
    import os
    import ssl
    import time
    import urllib.error
    import urllib.request
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    # Each entry: (namespace, cronjob name, max age in seconds before "stale").
    # Daily jobs get 26h (one day plus runtime slack), so "ok" means "ran today".
    # The 6-hourly MinIO mirror tolerates one missed run.
    WATCHED_BACKUPS = [
        ("longhorn-system", "backup-daily", 26 * 3600),
        ("longhorn-system", "snapshot-daily", 26 * 3600),
        ("minio", "minio-mirror-backup", 12 * 3600),
        ("etcd-backup", "etcd-snapshot-offsite", 26 * 3600),
        ("etcd-backup", "sealed-secrets-keys-offsite", 26 * 3600),
    ]

    PORT = int(os.environ.get("PORT", "8080"))
    CACHE_TTL_SECONDS = int(os.environ.get("CACHE_TTL_SECONDS", "30"))
    ALLOWED_ORIGINS = [
        origin.strip()
        for origin in os.environ.get(
            "CORS_ALLOW_ORIGIN", "https://www.yesidlopez.de"
        ).split(",")
        if origin.strip()
    ]
    API_HOST = os.environ.get("KUBERNETES_SERVICE_HOST", "kubernetes.default.svc")
    API_PORT = os.environ.get("KUBERNETES_SERVICE_PORT", "443")
    API_BASE = f"https://{API_HOST}:{API_PORT}"
    TOKEN_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/token"
    CA_PATH = "/var/run/secrets/kubernetes.io/serviceaccount/ca.crt"

    cache = {"expires_at": 0, "payload": None}

    def read_token():
        with open(TOKEN_PATH, "r", encoding="utf-8") as token_file:
            return token_file.read().strip()

    def kube_get(path):
        context = ssl.create_default_context(cafile=CA_PATH)
        request = urllib.request.Request(
            f"{API_BASE}{path}",
            headers={"Authorization": f"Bearer {read_token()}", "Accept": "application/json"},
        )
        with urllib.request.urlopen(request, context=context, timeout=5) as response:
            return json.loads(response.read().decode("utf-8"))

    def condition_is_true(resource, condition_type):
        for condition in resource.get("status", {}).get("conditions", []):
            if condition.get("type") == condition_type:
                return condition.get("status") == "True"
        return False

    def count_unavailable_workloads(resources, kind):
        unavailable = 0
        for item in resources.get("items", []):
            status = item.get("status", {})
            desired = status.get("replicas") or item.get("spec", {}).get("replicas") or 0
            ready = status.get("readyReplicas") or status.get("numberReady") or 0
            if kind == "daemonset":
                desired = status.get("desiredNumberScheduled") or 0
            if desired > ready:
                unavailable += 1
        return unavailable

    def flux_ready_summary(resources):
        total = 0
        not_ready = 0
        for item in resources.get("items", []):
            total += 1
            if not condition_is_true(item, "Ready"):
                not_ready += 1
        return total, not_ready

    def iso_to_epoch(value):
        if not value:
            return None
        try:
            return calendar.timegm(time.strptime(value, "%Y-%m-%dT%H:%M:%SZ"))
        except (ValueError, TypeError):
            return None

    def epoch_to_iso(value):
        if value is None:
            return None
        return time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime(value))

    def backup_summary():
        # Job names stay server-side; only counts and timestamps are published.
        now = time.time()
        status = "ok"
        oldest_epoch = None
        ok_count = 0
        overdue_count = 0
        oldest_overdue_epoch = None
        cronjobs_by_namespace = {}
        for namespace, name, max_age in WATCHED_BACKUPS:
            if namespace not in cronjobs_by_namespace:
                try:
                    cronjobs_by_namespace[namespace] = kube_get(
                        f"/apis/batch/v1/namespaces/{namespace}/cronjobs"
                    )
                except Exception:
                    cronjobs_by_namespace[namespace] = None
            cronjobs = cronjobs_by_namespace[namespace]
            if cronjobs is None:
                if status == "ok":
                    status = "unknown"
                continue
            match = next(
                (cj for cj in cronjobs.get("items", []) if cj.get("metadata", {}).get("name") == name),
                None,
            )
            last_epoch = (
                iso_to_epoch(match.get("status", {}).get("lastSuccessfulTime")) if match else None
            )
            if last_epoch is None or (now - last_epoch) > max_age:
                status = "stale"
                overdue_count += 1
                if last_epoch is not None and (
                    oldest_overdue_epoch is None or last_epoch < oldest_overdue_epoch
                ):
                    oldest_overdue_epoch = last_epoch
                continue
            ok_count += 1
            if oldest_epoch is None or last_epoch < oldest_epoch:
                oldest_epoch = last_epoch
        checks = {
            "okToday": ok_count,
            "total": len(WATCHED_BACKUPS),
            "overdue": overdue_count,
            "oldestOverdueSuccessAt": epoch_to_iso(oldest_overdue_epoch),
        }
        return status, epoch_to_iso(oldest_epoch), checks

    def build_payload():
        nodes = kube_get("/api/v1/nodes")
        deployments = kube_get("/apis/apps/v1/deployments")
        statefulsets = kube_get("/apis/apps/v1/statefulsets")
        daemonsets = kube_get("/apis/apps/v1/daemonsets")
        kustomizations = kube_get("/apis/kustomize.toolkit.fluxcd.io/v1/kustomizations")
        helmreleases = kube_get("/apis/helm.toolkit.fluxcd.io/v2/helmreleases")

        node_count = len(nodes.get("items", []))
        ready_nodes = sum(1 for node in nodes.get("items", []) if condition_is_true(node, "Ready"))

        workload_total = (
            len(deployments.get("items", []))
            + len(statefulsets.get("items", []))
            + len(daemonsets.get("items", []))
        )
        unavailable_workloads = (
            count_unavailable_workloads(deployments, "deployment")
            + count_unavailable_workloads(statefulsets, "statefulset")
            + count_unavailable_workloads(daemonsets, "daemonset")
        )

        kustomization_total, kustomization_not_ready = flux_ready_summary(kustomizations)
        helmrelease_total, helmrelease_not_ready = flux_ready_summary(helmreleases)
        flux_not_ready = kustomization_not_ready + helmrelease_not_ready

        backups_status, backups_last_success, backup_checks = backup_summary()
        backups_alert = 1 if backups_status == "stale" else 0
        alert_count = (
            unavailable_workloads
            + flux_not_ready
            + max(node_count - ready_nodes, 0)
            + backups_alert
        )

        status = "operational"
        if (
            ready_nodes < node_count
            or flux_not_ready > 0
            or unavailable_workloads > 0
            or backups_status == "stale"
        ):
            status = "degraded"
        if ready_nodes == 0:
            status = "incident"

        return {
            "status": status,
            "nodes": ready_nodes,
            "nodeCount": node_count,
            "workloads": workload_total,
            "gitops": "healthy" if flux_not_ready == 0 else "degraded",
            "backups": {
                "status": backups_status,
                "lastSuccessAt": backups_last_success,
            },
            "alerts": alert_count,
            "checks": {
                "flux": {
                    "ready": kustomization_total + helmrelease_total - flux_not_ready,
                    "total": kustomization_total + helmrelease_total,
                },
                "backups": backup_checks,
                "nodes": {"ready": ready_nodes, "total": node_count},
                "workloads": {"unavailable": unavailable_workloads, "total": workload_total},
            },
            "updatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
        }

    def get_payload():
        now = time.time()
        if cache["payload"] is not None and cache["expires_at"] > now:
            return cache["payload"]
        try:
            payload = build_payload()
            cache["payload"] = payload
            cache["expires_at"] = now + CACHE_TTL_SECONDS
            return payload
        except Exception as error:
            fallback = {
                "status": "unknown",
                "nodes": None,
                "nodeCount": None,
                "workloads": None,
                "gitops": "unknown",
                "backups": {
                    "status": "unknown",
                    "lastSuccessAt": None,
                },
                "alerts": None,
                "updatedAt": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                "message": "Status is temporarily unavailable.",
            }
            if cache["payload"] is not None:
                stale = dict(cache["payload"])
                stale["stale"] = True
                stale["message"] = "Serving cached status while live status is temporarily unavailable."
                return stale
            return fallback

    class Handler(BaseHTTPRequestHandler):
        def log_message(self, format, *args):
            return

        def send_json(self, status_code, payload):
            body = json.dumps(payload, separators=(",", ":")).encode("utf-8")
            self.send_response(status_code)
            self.send_header("Content-Type", "application/json")
            self.send_header("Content-Length", str(len(body)))
            self.send_header("Cache-Control", "public, max-age=30")
            request_origin = self.headers.get("Origin")
            if request_origin in ALLOWED_ORIGINS:
                self.send_header("Access-Control-Allow-Origin", request_origin)
                self.send_header("Vary", "Origin")
            elif ALLOWED_ORIGINS:
                self.send_header("Access-Control-Allow-Origin", ALLOWED_ORIGINS[0])
            self.send_header("Access-Control-Allow-Methods", "GET, OPTIONS")
            self.send_header("Access-Control-Allow-Headers", "Content-Type")
            self.end_headers()
            self.wfile.write(body)

        def do_OPTIONS(self):
            self.send_json(204, {})

        def do_GET(self):
            if self.path in ["/", "/status"]:
                self.send_json(200, get_payload())
                return
            if self.path == "/healthz":
                self.send_json(200, {"ok": True})
                return
            self.send_json(404, {"error": "not found"})

    if __name__ == "__main__":
        server = ThreadingHTTPServer(("0.0.0.0", PORT), Handler)
        server.serve_forever()
