apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mi-carpeta-medica-ui
  namespace: mi-carpeta-medica-dev
spec:
  imageRepositoryRef:
    name: mi-carpeta-medica-ui
  policy:
    semver:
      range: ">=0.0.3"
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    extract: '$0'
