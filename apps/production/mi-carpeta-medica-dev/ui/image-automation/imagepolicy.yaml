apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mi-carpeta-medica-ui
  namespace: mi-carpeta-medica-dev
spec:
  imageRepositoryRef:
    name: mi-carpeta-medica-ui
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^dev-(?P<num>[0-9]+)$'
    extract: '$num'
