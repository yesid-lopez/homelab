# Dev's own CNPG cluster — isolated from prod, same bootstrap shape as
# prod/postgres-cluster.yaml. No barman backup plugin here: dev data is
# disposable test data, not worth backing up (see ../ENVIRONMENTS.md).
#
# Auth (GoTrue) has its own separate cluster now — see
# auth-postgres-cluster.yaml — so resetting this one's PVC only affects
# app data (documents, consultations, ...), never login.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mi-carpeta-medica-api-postgres
  namespace: mi-carpeta-medica-dev
spec:
  instances: 1

  bootstrap:
    initdb:
      database: mi_carpeta_medica
      owner: mi_carpeta_medica

  storage:
    size: 2Gi
    storageClass: longhorn

  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "250m"
