<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sticker Maker</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 1.5rem 0;
      display: flex; justify-content: center; align-items: flex-start;
      font-family: system-ui, -apple-system, sans-serif; background: #f0f2f5; color: #111;
    }
    main { width: min(92vw, 420px); display: flex; flex-direction: column; gap: 1rem; text-align: center; }
    h1 { font-size: 1.4rem; margin: 0; }
    #drop {
      display: block; border: 2px dashed #25d366; border-radius: 16px; padding: 1.5rem 1rem;
      background: #fff; cursor: pointer;
    }
    #drop.over { background: #e7fbe9; }
    #drop.compact { padding: .7rem 1rem; }
    #stage { display: none; position: relative; }
    #cursor { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    #preview {
      display: block; width: 100%; aspect-ratio: 1; border-radius: 16px;
      /* checkerboard so the transparency is visible */
      background: repeating-conic-gradient(#ddd 0 25%, #fff 0 50%) 50% / 24px 24px;
      touch-action: none; cursor: grab;
    }
    #preview:active { cursor: grabbing; }
    #stage.painting #preview { cursor: none; }
    .tools { display: flex; gap: .4rem; }
    .tools button { padding: .5rem .3rem; font-size: .85rem; background: #e4e6eb; color: #111; }
    .tools button.active { background: #128c7e; color: #fff; }
    #controls { display: none; text-align: left; font-size: .9rem; color: #333; }
    #controls { flex-direction: column; gap: .75rem; }
    #controls input { width: 100%; accent-color: #25d366; }
    .zoom-row { display: flex; align-items: center; gap: .5rem; }
    .zoom-row input { flex: 1; }
    .zoom-row button { flex: 0; padding: .4rem .8rem; font-size: .85rem; background: #128c7e; }
    .option-row { display: flex; align-items: center; gap: .5rem; }
    .option-row input[type="range"] { flex: 1; }
    #controls .option-row input[type="checkbox"] { width: auto; margin: 0; }
    #caption { width: 100%; padding: .6rem; border: 1px solid #ccc; border-radius: 10px; font-size: 1rem; }
    #controls input[type="color"] { width: 2.4rem; height: 2rem; padding: 0; border: 0; background: none; }
    .range-labels { display: flex; justify-content: space-between; font-size: .8rem; color: #777; }
    #status { min-height: 1.5em; margin: 0; color: #555; }
    .actions { display: flex; gap: .5rem; }
    button {
      flex: 1; padding: .8rem; border: 0; border-radius: 12px; font-size: 1rem;
      background: #25d366; color: #fff; cursor: pointer;
    }
    button.secondary { background: #128c7e; }
    button:disabled { opacity: .4; cursor: default; }
  </style>
</head>
<body>
  <main>
    <h1>Sticker Maker</h1>
    <label id="drop">
      <span id="drop-text">Toca para elegir una imagen o arrástrala aquí</span>
      <input id="file" type="file" accept="image/*" hidden />
    </label>
    <div id="stage">
      <canvas id="preview" width="512" height="512"></canvas>
      <canvas id="cursor" width="512" height="512"></canvas>
    </div>
    <div id="controls">
      <div class="tools">
        <button type="button" class="active" data-mode="move">✋ Mover</button>
        <button type="button" data-mode="erase">🧽 Borrar</button>
        <button type="button" data-mode="restore">🖌️ Restaurar</button>
        <button type="button" id="undo" disabled>↩︎ Deshacer</button>
      </div>
      <div id="brush-row" hidden>
        <label for="brush">Tamaño del pincel</label>
        <input id="brush" type="range" min="4" max="100" value="30" autocomplete="off" />
      </div>
      <div>
        <label for="zoom">Zoom</label>
        <div class="zoom-row">
          <input id="zoom" type="range" min="50" max="300" value="100" autocomplete="off" />
          <button id="reset-view" type="button">Centrar</button>
        </div>
      </div>
      <div>
        <div class="option-row">
          <input id="border" type="checkbox" checked autocomplete="off" />
          <label for="border">Borde blanco</label>
        </div>
        <input id="border-size" type="range" min="2" max="24" value="10" autocomplete="off" aria-label="Grosor del borde" />
      </div>
      <div>
        <label for="caption">Texto (en modo Mover, arrástralo para ubicarlo)</label>
        <input id="caption" type="text" maxlength="40" placeholder="Escribe algo…" autocomplete="off" />
        <div class="option-row">
          <input id="caption-size" type="range" min="20" max="120" value="64" autocomplete="off" aria-label="Tamaño del texto" />
          <input id="caption-color" type="color" value="#ffffff" aria-label="Color del texto" />
        </div>
      </div>
      <div>
        <label for="cleanup">Limpieza del fondo</label>
        <input id="cleanup" type="range" min="0" max="240" value="60" autocomplete="off" />
        <div class="range-labels"><span>Menos</span><span>Más</span></div>
      </div>
    </div>
    <p id="status"></p>
    <div class="actions">
      <button id="copy" disabled>Copiar al portapapeles</button>
      <button id="download" class="secondary" disabled>Descargar WebP</button>
    </div>
  </main>

  <script type="module">
    import { AutoModel, AutoProcessor, RawImage, env } from 'https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.2';

    // The Cache API only exists on https/localhost. Over plain http (e.g. a LAN IP
    // from a phone) skip caching instead of failing; the model is re-downloaded each visit.
    env.useBrowserCache = 'caches' in self;

    const MODEL_ID = 'briaai/RMBG-1.4';
    const SIZE = 512;
    const MARGIN = 16;
    const WORK_SIZE = 1024; // max side used for the model and the cleanup pass
    const MAX_WEBP_BYTES = 100 * 1024;
    // Separate pieces smaller than this fraction of the main subject are dropped.
    const MIN_PIECE_RATIO = 0.05;

    const $ = (id) => document.getElementById(id);
    const canvas = $('preview');
    const ctx = canvas.getContext('2d');
    let cutout = null; // image with the model's mask as alpha, kept so the slider can re-run cleanup
    let layer = null; // cleaned cutout plus the bounds of its visible pixels
    // Per pixel of the cutout: -1 = untouched, otherwise the alpha the brush left there.
    let edits = null;
    const undoStack = [];
    let mode = 'move';
    const MAX_UNDO = 20;
    const BRUSH_HARD = 0.5; // inner fraction of the brush radius at full strength; the rest fades out
    const caption = { x: SIZE / 2, y: SIZE - 64 }; // center of the text, in sticker pixels

    // Scratch canvases for composing the sticker: the cutout alone, its white silhouette, and the border.
    const scratch = () => {
      const c = new OffscreenCanvas(SIZE, SIZE);
      return { c, ctx: c.getContext('2d') };
    };
    const subject = scratch();
    const silhouette = scratch();
    const outline = scratch();
    const view = { zoom: 1, panX: 0, panY: 0 };
    let modelPromise = null;

    const setStatus = (msg) => { $('status').textContent = msg; };
    const setReady = (ready) => { $('copy').disabled = $('download').disabled = !ready; };

    // Loaded once and cached by the browser. Uses the GPU when available, else WebAssembly.
    function loadModel() {
      const progress_callback = (p) => {
        if (p.status === 'progress' && p.file.endsWith('.onnx')) {
          setStatus(`Descargando modelo… ${Math.round(p.progress)}%`);
        }
      };
      const load = (device) => Promise.all([
        AutoModel.from_pretrained(MODEL_ID, { config: { model_type: 'custom' }, dtype: 'fp16', device, progress_callback }),
        AutoProcessor.from_pretrained(MODEL_ID),
      ]);
      modelPromise ??= (navigator.gpu ? load('webgpu').catch(() => load('wasm')) : load('wasm'))
        .catch((err) => { modelPromise = null; throw err; });
      return modelPromise;
    }

    async function handleFile(file) {
      if (!file?.type.startsWith('image/')) return;
      setReady(false);
      setStatus('Quitando el fondo… (la primera vez descarga el modelo)');
      try {
        cutout = await removeBackground(file);
        edits = new Int16Array(cutout.width * cutout.height).fill(-1);
        undoStack.length = 0;
        $('undo').disabled = true;
        $('cleanup').value = $('cleanup').defaultValue;
        resetView();
        $('drop').classList.add('compact');
        $('drop-text').textContent = 'Cambiar imagen';
        $('stage').style.display = 'block';
        $('controls').style.display = 'flex';
        setStatus('¡Listo!');
      } catch (err) {
        console.error(err);
        setStatus(`No se pudo procesar la imagen: ${err.message}`);
      }
    }

    async function removeBackground(file) {
      const [model, processor] = await loadModel();
      setStatus('Quitando el fondo…');

      const img = await createImageBitmap(file);
      const scale = Math.min(1, WORK_SIZE / Math.max(img.width, img.height));
      const w = Math.round(img.width * scale);
      const h = Math.round(img.height * scale);
      const work = new OffscreenCanvas(w, h);
      const wctx = work.getContext('2d');
      wctx.drawImage(img, 0, 0, w, h);

      const { pixel_values } = await processor(RawImage.fromCanvas(work).rgb());
      const { output } = await model({ input: pixel_values });
      const mask = await RawImage.fromTensor(output[0].mul(255).to('uint8')).resize(w, h);

      const image = wctx.getImageData(0, 0, w, h);
      for (let i = 0; i < w * h; i++) image.data[i * 4 + 3] = mask.data[i];
      return image;
    }

    // refit: recompute the crop to the visible pixels. Skipped on undo so the image doesn't jump.
    function applyCleanup({ refit = true } = {}) {
      const cleaned = cleanAlpha(cutout, Number($('cleanup').value), edits);
      const work = new OffscreenCanvas(cleaned.width, cleaned.height);
      const wctx = work.getContext('2d');
      wctx.putImageData(cleaned, 0, 0);
      const bounds = refit || !layer ? alphaBounds(cleaned) : layer;
      layer = { canvas: work, ctx: wctx, image: cleaned, x: bounds.x, y: bounds.y, w: bounds.w, h: bounds.h };
      draw();
      setReady(true);
    }

    // At zoom 1 the visible pixels fit the 512×512 sticker with a margin (plus room for
    // the border); zoom and pan are applied on top of that.
    function draw() {
      if (!layer) return;
      const border = $('border').checked ? Number($('border-size').value) : 0;
      const { canvas: src, x, y, w, h } = layer;
      const room = SIZE - 2 * (MARGIN + border);
      const scale = Math.min(room / w, room / h) * view.zoom;
      // Top-left of the whole cutout on the sticker; kept so brush strokes can map back to it.
      const ox = (SIZE - w * scale) / 2 + view.panX - x * scale;
      const oy = (SIZE - h * scale) / 2 + view.panY - y * scale;
      layer.fit = { scale, ox, oy };

      subject.ctx.clearRect(0, 0, SIZE, SIZE);
      subject.ctx.drawImage(src, ox, oy, src.width * scale, src.height * scale);

      ctx.clearRect(0, 0, SIZE, SIZE);
      if (border) drawBorder(border);
      ctx.drawImage(subject.c, 0, 0);
      drawCaption();
    }

    // Classic sticker outline: stamp a white silhouette of the subject in a circle
    // around it (a cheap dilation), then add a soft shadow under the result.
    function drawBorder(thickness) {
      const sctx = silhouette.ctx;
      sctx.globalCompositeOperation = 'source-over';
      sctx.clearRect(0, 0, SIZE, SIZE);
      sctx.drawImage(subject.c, 0, 0);
      sctx.globalCompositeOperation = 'source-in';
      sctx.fillStyle = '#fff';
      sctx.fillRect(0, 0, SIZE, SIZE);
      sctx.globalCompositeOperation = 'source-over';

      const octx = outline.ctx;
      octx.clearRect(0, 0, SIZE, SIZE);
      octx.drawImage(silhouette.c, 0, 0);
      const STEPS = 24;
      for (const r of [thickness / 2, thickness]) {
        for (let i = 0; i < STEPS; i++) {
          const a = (i / STEPS) * Math.PI * 2;
          octx.drawImage(silhouette.c, Math.cos(a) * r, Math.sin(a) * r);
        }
      }

      ctx.save();
      ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
      ctx.shadowBlur = 6;
      ctx.shadowOffsetY = 2;
      ctx.drawImage(outline.c, 0, 0);
      ctx.restore();
    }

    // White bold text with a black outline, shrunk to fit the sticker width.
    function captionLayout() {
      const text = $('caption').value.trim();
      if (!text) return null;
      let size = Number($('caption-size').value);
      const font = (px) => `900 ${px}px Impact, "Arial Black", system-ui, sans-serif`;
      ctx.font = font(size);
      while (size > 12 && ctx.measureText(text).width > SIZE - 24) {
        size -= 2;
        ctx.font = font(size);
      }
      return { text, size, font: font(size), width: ctx.measureText(text).width };
    }

    function drawCaption() {
      const t = captionLayout();
      if (!t) return;
      ctx.save();
      ctx.font = t.font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.lineJoin = 'round';
      ctx.lineWidth = t.size * 0.2;
      ctx.strokeStyle = '#000';
      ctx.strokeText(t.text, caption.x, caption.y);
      ctx.fillStyle = $('caption-color').value;
      ctx.fillText(t.text, caption.x, caption.y);
      ctx.restore();
    }

    function hitsCaption(p) {
      const t = captionLayout();
      if (!t) return false;
      return Math.abs(p.x - caption.x) <= t.width / 2 + 12 && Math.abs(p.y - caption.y) <= t.size / 2 + 12;
    }

    function setZoom(zoom) {
      view.zoom = Math.min(3, Math.max(0.5, zoom));
      $('zoom').value = Math.round(view.zoom * 100);
      draw();
    }

    function resetView() {
      view.panX = view.panY = 0;
      if (cutout) applyCleanup();
      setZoom(1);
    }

    // The model leaves faint, semi-transparent leftovers of the background
    // (tables, plates…). Drop pixels below the threshold, then keep only the
    // main subject plus any big piece attached to it.
    // Brush edits are applied first, so erasing can cut off a piece that then gets dropped.
    function cleanAlpha(src, threshold, edits) {
      const { width, height } = src;
      const out = new ImageData(new Uint8ClampedArray(src.data), width, height);
      const d = out.data;
      const n = width * height;

      for (let i = 0; i < n; i++) {
        if (edits[i] >= 0) d[i * 4 + 3] = edits[i];
        else if (d[i * 4 + 3] < threshold) d[i * 4 + 3] = 0;
      }

      const label = new Int32Array(n).fill(-1);
      const sizes = [];
      const stack = new Int32Array(n);
      for (let start = 0; start < n; start++) {
        if (label[start] !== -1 || d[start * 4 + 3] === 0) continue;
        const id = sizes.length;
        let size = 0, top = 0;
        stack[top++] = start;
        label[start] = id;
        while (top) {
          const p = stack[--top];
          size++;
          const px = p % width;
          const neighbors = [
            px > 0 ? p - 1 : -1,
            px < width - 1 ? p + 1 : -1,
            p - width,
            p + width,
          ];
          for (const q of neighbors) {
            if (q < 0 || q >= n || label[q] !== -1 || d[q * 4 + 3] === 0) continue;
            label[q] = id;
            stack[top++] = q;
          }
        }
        sizes.push(size);
      }

      const minSize = sizes.reduce((a, b) => Math.max(a, b), 0) * MIN_PIECE_RATIO;
      for (let i = 0; i < n; i++) {
        if (label[i] !== -1 && sizes[label[i]] < minSize) d[i * 4 + 3] = 0;
      }
      return out;
    }

    function alphaBounds({ data, width, height }) {
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          if (data[(y * width + x) * 4 + 3] > 0) {
            if (x < minX) minX = x;
            if (x > maxX) maxX = x;
            if (y < minY) minY = y;
            if (y > maxY) maxY = y;
          }
        }
      }
      if (maxX < 0) return { x: 0, y: 0, w: width, h: height };
      return { x: minX, y: minY, w: maxX - minX + 1, h: maxY - minY + 1 };
    }

    const toBlob = (type, quality) =>
      new Promise((resolve) => canvas.toBlob(resolve, type, quality));

    // WhatsApp static stickers must be under 100 KB.
    async function toStickerWebp() {
      let blob;
      for (let q = 0.9; q >= 0.3; q -= 0.1) {
        blob = await toBlob('image/webp', q);
        if (blob.size <= MAX_WEBP_BYTES) break;
      }
      return blob;
    }

    let pending = null;
    $('cleanup').addEventListener('input', () => {
      if (!cutout) return;
      cancelAnimationFrame(pending);
      pending = requestAnimationFrame(applyCleanup);
    });

    for (const id of ['border', 'border-size', 'caption', 'caption-size', 'caption-color']) {
      $(id).addEventListener('input', draw);
    }

    $('zoom').addEventListener('input', (e) => setZoom(e.target.value / 100));
    $('reset-view').addEventListener('click', resetView);

    document.querySelectorAll('[data-mode]').forEach((btn) => {
      btn.addEventListener('click', () => {
        mode = btn.dataset.mode;
        document.querySelectorAll('[data-mode]').forEach((b) => b.classList.toggle('active', b === btn));
        $('brush-row').hidden = mode === 'move';
        $('stage').classList.toggle('painting', mode !== 'move');
        clearCursor();
      });
    });

    $('undo').addEventListener('click', () => {
      if (!undoStack.length) return;
      edits = undoStack.pop();
      $('undo').disabled = !undoStack.length;
      applyCleanup({ refit: false });
    });

    // Screen position → sticker pixels.
    function toSticker(e) {
      const rect = canvas.getBoundingClientRect();
      const k = SIZE / rect.width;
      return { x: (e.clientX - rect.left) * k, y: (e.clientY - rect.top) * k };
    }

    // Sticker pixels → cutout pixels, where the edits live.
    function toCutout(p) {
      const { scale, ox, oy } = layer.fit;
      return { x: (p.x - ox) / scale, y: (p.y - oy) / scale };
    }

    const cursorCtx = $('cursor').getContext('2d');
    const clearCursor = () => cursorCtx.clearRect(0, 0, SIZE, SIZE);
    function drawCursor(p) {
      clearCursor();
      cursorCtx.beginPath();
      cursorCtx.arc(p.x, p.y, $('brush').value / 2, 0, Math.PI * 2);
      cursorCtx.lineWidth = 2;
      cursorCtx.strokeStyle = mode === 'erase' ? '#e53935' : '#25d366';
      cursorCtx.stroke();
    }

    let stroke = null; // last brush position in cutout pixels while painting
    let strokeBase = null;
    let strokeWeight = null;

    function startStroke(p) {
      undoStack.push(edits.slice());
      if (undoStack.length > MAX_UNDO) undoStack.shift();
      $('undo').disabled = false;
      // Alpha at the start of the stroke plus the strongest brush weight each pixel has
      // received, so overlapping dabs along one stroke don't turn the soft edge hard.
      const { data } = layer.image;
      const n = edits.length;
      strokeBase = new Uint8Array(n);
      for (let i = 0; i < n; i++) strokeBase[i] = data[i * 4 + 3];
      strokeWeight = new Float32Array(n);
      stroke = toCutout(p);
      paintSegment(stroke, stroke);
    }

    function paintSegment(from, to) {
      const r = $('brush').value / 2 / layer.fit.scale;
      const steps = Math.max(1, Math.ceil(Math.hypot(to.x - from.x, to.y - from.y) / (r / 3)));
      const { width, height, data } = layer.image;
      const erase = mode === 'erase';
      const inner = r * BRUSH_HARD;
      let minX = width, minY = height, maxX = -1, maxY = -1;
      for (let s = 0; s <= steps; s++) {
        const cx = from.x + ((to.x - from.x) * s) / steps;
        const cy = from.y + ((to.y - from.y) * s) / steps;
        const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(width - 1, Math.ceil(cx + r));
        const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(height - 1, Math.ceil(cy + r));
        for (let y = y0; y <= y1; y++) {
          for (let x = x0; x <= x1; x++) {
            const dist = Math.hypot(x - cx, y - cy);
            if (dist > r) continue;
            const t = dist <= inner ? 1 : (r - dist) / (r - inner);
            const weight = t * t * (3 - 2 * t); // smoothstep fade towards the edge
            const i = y * width + x;
            if (weight <= strokeWeight[i]) continue;
            strokeWeight[i] = weight;
            const base = strokeBase[i];
            const alpha = Math.round(erase ? base * (1 - weight) : base + (255 - base) * weight);
            edits[i] = alpha;
            data[i * 4 + 3] = alpha;
          }
        }
        if (x0 <= x1 && y0 <= y1) {
          minX = Math.min(minX, x0); maxX = Math.max(maxX, x1);
          minY = Math.min(minY, y0); maxY = Math.max(maxY, y1);
        }
      }
      if (maxX < 0) return;
      layer.ctx.putImageData(layer.image, 0, 0, minX, minY, maxX - minX + 1, maxY - minY + 1);
      draw();
    }

    // Move mode: drag with one finger/mouse to move. Brush modes: drag to paint.
    // In any mode, pinch with two fingers or use the wheel to zoom.
    const pointers = new Map();
    let pinch = null;
    let draggingCaption = false;
    const pinchDistance = () => {
      const [a, b] = [...pointers.values()];
      return Math.hypot(a.x - b.x, a.y - b.y);
    };
    canvas.addEventListener('pointerdown', (e) => {
      if (!layer) return;
      canvas.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 2) {
        stroke = null;
        draggingCaption = false;
        pinch = { distance: pinchDistance(), zoom: view.zoom };
      } else if (mode === 'move' && hitsCaption(toSticker(e))) {
        draggingCaption = true;
      } else if (mode !== 'move') {
        startStroke(toSticker(e));
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (mode !== 'move' && layer) drawCursor(toSticker(e));
      const prev = pointers.get(e.pointerId);
      if (!prev) return;
      pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
      if (pointers.size === 1 && draggingCaption) {
        const k = SIZE / canvas.clientWidth;
        caption.x = Math.min(SIZE, Math.max(0, caption.x + (e.clientX - prev.x) * k));
        caption.y = Math.min(SIZE, Math.max(0, caption.y + (e.clientY - prev.y) * k));
        draw();
      } else if (pointers.size === 1 && mode === 'move') {
        const k = SIZE / canvas.clientWidth; // screen pixels → sticker pixels
        view.panX += (e.clientX - prev.x) * k;
        view.panY += (e.clientY - prev.y) * k;
        draw();
      } else if (pointers.size === 1 && stroke) {
        const next = toCutout(toSticker(e));
        paintSegment(stroke, next);
        stroke = next;
      } else if (pinch) {
        setZoom(pinch.zoom * (pinchDistance() / pinch.distance));
      }
    });
    const endPointer = (e) => {
      pointers.delete(e.pointerId);
      if (pointers.size < 2) pinch = null;
      if (!pointers.size) {
        stroke = null;
        draggingCaption = false;
      }
    };
    canvas.addEventListener('pointerup', endPointer);
    canvas.addEventListener('pointercancel', endPointer);
    canvas.addEventListener('pointerleave', clearCursor);
    canvas.addEventListener('wheel', (e) => {
      e.preventDefault();
      setZoom(view.zoom * Math.exp(-e.deltaY * 0.002));
    }, { passive: false });

    // Browsers only allow PNG images in the clipboard, so we copy the PNG version.
    $('copy').addEventListener('click', async () => {
      if (!window.isSecureContext || !navigator.clipboard?.write) {
        setStatus('Copiar solo funciona si abres la página con https (o en localhost). Usa "Descargar WebP".');
        return;
      }
      try {
        // Passing the promise (not an awaited blob) keeps Safari's user-gesture requirement happy.
        await navigator.clipboard.write([new ClipboardItem({ 'image/png': toBlob('image/png') })]);
        setStatus('Copiado. Pégalo en un chat de WhatsApp.');
      } catch (err) {
        console.error(err);
        setStatus(`Tu navegador no permitió copiar (${err.message}). Usa "Descargar WebP".`);
      }
    });

    $('download').addEventListener('click', async () => {
      const blob = await toStickerWebp();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'sticker.webp';
      a.click();
      URL.revokeObjectURL(a.href);
    });

    $('file').addEventListener('change', (e) => handleFile(e.target.files[0]));
    const drop = $('drop');
    drop.addEventListener('dragover', (e) => { e.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', () => drop.classList.remove('over'));
    drop.addEventListener('drop', (e) => {
      e.preventDefault();
      drop.classList.remove('over');
      handleFile(e.dataTransfer.files[0]);
    });
  </script>
</body>
</html>
