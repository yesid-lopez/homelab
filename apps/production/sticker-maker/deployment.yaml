apiVersion: apps/v1
kind: Deployment
metadata:
  name: sticker-maker
  namespace: sticker-maker
  labels:
    app: sticker-maker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sticker-maker
  template:
    metadata:
      labels:
        app: sticker-maker
    spec:
      containers:
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.31.7-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
              readOnly: true
          resources:
            requests:
              memory: "16Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
      volumes:
        - name: html
          configMap:
            name: sticker-maker-html
