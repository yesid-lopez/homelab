apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: mi-carpeta-medica-api-postgres
  namespace: mi-carpeta-medica-prod
spec:
  instances: 1

  inheritedMetadata:
    labels:
      recurring-job.longhorn.io/source: enabled
      recurring-job-group.longhorn.io/backup: enabled

  # Starts empty (fresh initdb). This is deliberate: applying this manifest
  # must not touch the still-live mi-carpeta-medica-api-postgres cluster in
  # the mi-carpeta-medica-api namespace. The actual document/consultation
  # data is copied over as a separate, manual step — see MIGRATION.md —
  # before cutting the app/ingress over to this namespace.
  bootstrap:
    initdb:
      database: mi_carpeta_medica
      owner: mi_carpeta_medica

  storage:
    size: 5Gi
    storageClass: longhorn

  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "500m"

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: mi-carpeta-medica-api-postgres-store
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: mi-carpeta-medica-api-postgres-store
  namespace: mi-carpeta-medica-prod
spec:
  configuration:
    destinationPath: s3://postgres-backups/mi-carpeta-medica-prod-postgres
    endpointURL: http://minio.minio.svc.cluster.local:9000
    s3Credentials:
      accessKeyId:
        name: minio-backup-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: minio-backup-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
    data:
      compression: gzip
  retentionPolicy: "14d"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: mi-carpeta-medica-api-postgres-daily
  namespace: mi-carpeta-medica-prod
spec:
  schedule: "0 15 3 * * *"
  backupOwnerReference: self
  cluster:
    name: mi-carpeta-medica-api-postgres
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
