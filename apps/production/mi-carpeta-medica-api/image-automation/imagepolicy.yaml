apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: mi-carpeta-medica-api
  namespace: mi-carpeta-medica-api
spec:
  imageRepositoryRef:
    name: mi-carpeta-medica-api
  policy:
    semver:
      range: ">=0.6.0"
  filterTags:
    pattern: '^v[0-9]+\.[0-9]+\.[0-9]+$'
    extract: '$0'
