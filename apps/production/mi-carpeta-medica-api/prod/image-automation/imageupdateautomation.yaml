apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: mi-carpeta-medica-api
  namespace: mi-carpeta-medica-api
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: |
        Automated image update for mi-carpeta-medica-api

        Automation name: {{ .AutomationObject }}

        Files:
        {{ range $filename, $_ := .Changed.FileChanges -}}
        - {{ $filename }}
        {{ end -}}

        Objects:
        {{ range $resource, $_ := .Changed.Objects -}}
        - {{ $resource.Kind }} {{ $resource.Name }}
        {{ end -}}

        Images:
        {{ range .Changed.Changes -}}
        - {{.NewValue}}
        {{ end -}}
    push:
      branch: main
  update:
    # The "$imagepolicy" setter markers live in base/deployment.yaml, shared
    # by both the dev and prod overlays — scanning ../base (not this prod/
    # dir) keeps a single automation bumping the one image tag both
    # overlays build from.
    path: ./apps/production/mi-carpeta-medica-api/base
    strategy: Setters
