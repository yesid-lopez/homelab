apiVersion: v1
kind: ServiceAccount
metadata:
  name: sealed-secrets-keys-offsite
  namespace: etcd-backup
---
# Scoped to flux-system because that is where the sealed-secrets controller
# keeps its keys. RBAC cannot filter by label, so this grants read on every
# secret in that namespace; the job itself narrows the request with a label
# selector. Note this is not an escalation over what the neighbouring etcd job
# already handles, since an etcd snapshot contains every secret in the cluster.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sealed-secrets-keys-reader
  namespace: flux-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sealed-secrets-keys-offsite
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sealed-secrets-keys-reader
subjects:
  - kind: ServiceAccount
    name: sealed-secrets-keys-offsite
    namespace: etcd-backup
