apiVersion: batch/v1
kind: CronJob
metadata:
  name: sealed-secrets-keys-offsite
  namespace: etcd-backup
spec:
  # The nightly etcd snapshot copy already carries these keys, but recovering one
  # from a 233 MB bbolt database is a lot of work for 100 KB of PEM. This keeps a
  # directly usable copy next to it. Runs after the etcd job so the two do not
  # compete for the same NFS mount.
  schedule: "45 0 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: sealed-secrets-keys-offsite
          containers:
            - name: export
              # busybox has no kubectl, and its wget cannot validate the API
              # server certificate, which is not acceptable for fetching private
              # keys. This image is multi-arch, so the job is free to land on
              # either node.
              image: docker.io/alpine/k8s:1.34.1
              # The destination directory is 0700 root-owned on the NFS share,
              # which is exported with no_root_squash.
              securityContext:
                runAsUser: 0
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
              env:
                - name: RETENTION_DAYS
                  value: "14"
              command:
                - sh
                - -c
                - |
                  set -eu
                  umask 077
                  DEST=/mnt/sealed-secrets
                  mkdir -p "$DEST"
                  chmod 700 "$DEST"
                  OUT="${DEST}/sealed-secrets-keys-$(date -u +%Y-%m-%d).yaml"

                  # The controller mints a fresh key roughly every 30 days and
                  # never drops the old ones, so every dump holds the full set
                  # and the newest file is always sufficient on its own.
                  kubectl get secrets -n flux-system \
                    -l sealedsecrets.bitnami.com/sealed-secrets-key \
                    -o yaml > "${OUT}.tmp"

                  # An empty or truncated dump is worse than no dump, because it
                  # still looks like a backup.
                  KEYS=$(grep -c 'tls.key:' "${OUT}.tmp" || true)
                  if [ "$KEYS" -lt 1 ]; then
                    echo "[$(date -u +%FT%TZ)] no keys in the dump, refusing to publish"
                    rm -f "${OUT}.tmp"
                    exit 1
                  fi

                  mv "${OUT}.tmp" "$OUT"
                  chmod 600 "$OUT"
                  sync
                  echo "[$(date -u +%FT%TZ)] wrote ${KEYS} keys to ${OUT}"
                  ls -l "$OUT"

                  echo "[$(date -u +%FT%TZ)] pruning dumps older than ${RETENTION_DAYS} days"
                  find "$DEST" -mindepth 1 -maxdepth 1 -type f \
                    -name 'sealed-secrets-keys-*.yaml' -mtime "+${RETENTION_DAYS}" \
                    -exec rm -f {} \;

                  echo "[$(date -u +%FT%TZ)] done"
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: nfs
                  mountPath: /mnt
          volumes:
            - name: nfs
              nfs:
                server: 192.168.2.10
                path: /ssd-pool/longhorn-backups
