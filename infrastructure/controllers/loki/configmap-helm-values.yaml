---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-helm-chart-value-overrides
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: "Enabled"
data:
  values.yaml: |
    deploymentMode: SingleBinary
    
    loki:
      auth_enabled: false
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
          ruler: ruler
          admin: admin
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
      ingester:
        chunk_encoding: snappy
      tracing:
        enabled: false
      querier:
        max_concurrent: 2
    
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 30Gi
      extraArgs:
        - -config.expand-env=true
      resources:
        requests:
          memory: 512Mi
          cpu: 250m
        limits:
          memory: 2Gi
          cpu: 1000m
    
    # Disable SimpleScalable components to avoid conflicts
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    
    lokiCanary:
      enabled: false
    
    test:
      enabled: false
    
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      serviceMonitor:
        enabled: false
      dashboards:
        enabled: false
    
    gateway:
      enabled: true
      replicas: 1
      ingress:
        enabled: false
      resources:
        requests:
          memory: 64Mi
          cpu: 50m
        limits:
          memory: 128Mi
          cpu: 200m