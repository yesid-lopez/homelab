---
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-helm-chart-value-overrides
  namespace: flux-system
  labels:
    reconcile.fluxcd.io/watch: "Enabled"
data:
  values.yaml: |
    deploymentMode: SingleBinary
    
    loki:
      auth_enabled: false
      storage:
        type: filesystem
        bucketNames:
          chunks: chunks
          ruler: ruler
          admin: admin
      commonConfig:
        replication_factor: 1
      schemaConfig:
        configs:
        - from: 2024-04-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: loki_index_
            period: 24h
      ingester:
        chunk_encoding: snappy
      tracing:
        enabled: false
      querier:
        max_concurrent: 2
    
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        storageClass: longhorn
        size: 30Gi
      extraArgs:
        - -config.expand-env=true
      resources:
        requests:
          memory: 256Mi
          cpu: 50m
        limits:
          memory: 1Gi
    
    # Disable SimpleScalable components to avoid conflicts
    read:
      replicas: 0
    write:
      replicas: 0
    backend:
      replicas: 0
    
    chunksCache:
      enabled: false
    resultsCache:
      enabled: false
    
    lokiCanary:
      enabled: false
    
    test:
      enabled: false
    
    monitoring:
      selfMonitoring:
        enabled: false
        grafanaAgent:
          installOperator: false
      serviceMonitor:
        enabled: false
      dashboards:
        enabled: false
    
    gateway:
      enabled: true
      replicas: 1
      ingress:
        enabled: false
      resources:
        requests:
          memory: 32Mi
          cpu: 10m
        limits:
          memory: 128Mi

    # The chart's sidecar.rules.enabled default (true) injects an unbounded
    # kiwigrid/k8s-sidecar container into the single-binary pod to watch for
    # loki_rule ConfigMaps. 30d Prometheus history shows it peaking at ~90Mi
    # (currently ~75Mi live) — same order of magnitude as the other
    # components this PR bounds, and otherwise the one unbounded consumer
    # left in this pod.
    sidecar:
      resources:
        requests:
          memory: 128Mi
          cpu: 10m
        limits:
          memory: 384Mi