apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
  namespace: tailscale
spec:
  interval: 30m
  timeout: 10m
  chart:
    spec:
      chart: tailscale-operator
      version: 1.104.2
      sourceRef:
        kind: HelmRepository
        name: tailscale
        namespace: flux-system
      interval: 12h
  install:
    timeout: 10m
    remediation:
      retries: 3
  upgrade:
    timeout: 10m
    remediation:
      retries: 3
  valuesFrom:
  - kind: ConfigMap
    name: tailscale-operator-helm-chart-value-overrides
    valuesKey: values.yaml
